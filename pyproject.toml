[project]
name = "nlpproyect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maitanelizarraga", email = "maitane.lizarraga@opendeusto.es" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "gensim>=4.4.0",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "regex>=2026.9.29",
    "sacremoses>=0.2.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[project.scripts]
nlpproyect = "nlpproyect:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
