[project]
name = "nlpproyect"
version = "0.1.0"
description = "Proyecto NLP"
readme = "README.md"
authors = [
    { name = "maitanelizarraga", email = "maitane.lizarraga@opendeusto.es" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "es-core-news-md",
    "gensim>=4.4.0",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "regex>=2026.9.29",
    "sacremoses>=0.2.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[tool.uv]
package = false

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }